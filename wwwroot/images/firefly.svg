<svg viewBox="10 5 110 115" xmlns="http://www.w3.org/2000/svg" class="firefly-mascot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="firefly-gradient" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d9ffe9"/>
      <stop offset="1" stop-color="#33e07a"/>
    </radialGradient>
  </defs>

  <g class="firefly-wing" style="animation-delay:-.3s">
    <ellipse cx="34" cy="58" rx="16" ry="9" fill="#eafff3" opacity=".5"/>
  </g>
  <g class="firefly-wing">
    <ellipse cx="96" cy="58" rx="16" ry="9" fill="#eafff3" opacity=".5"/>
  </g>

  <circle class="firefly-glow" cx="65" cy="92" r="7" fill="#00FF66"/>

  <ellipse cx="65" cy="60" rx="24" ry="26" fill="url(#firefly-gradient)"/>

  <g class="firefly-blink">
    <circle cx="57" cy="56" r="5" fill="#0a1f14"/>
    <circle cx="73" cy="56" r="5" fill="#0a1f14"/>
    <circle cx="58.8" cy="53.8" r="1.7" fill="#fff"/>
    <circle cx="74.8" cy="53.8" r="1.7" fill="#fff"/>
  </g>

  <path d="M59 66q6 4 12 0" stroke="#0a1f14" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="49" cy="64" r="4.6" fill="#ff9db8" opacity=".5"/>
  <circle cx="81" cy="64" r="4.6" fill="#ff9db8" opacity=".5"/>

  <path d="M56 36q-4 -8 -8 -10" stroke="#0a1f14" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M74 36q4 -8 8 -10" stroke="#0a1f14" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="48" cy="25" r="2.4" fill="#00FF66"/>
  <circle cx="82" cy="25" r="2.4" fill="#00FF66"/>

  <style>
    .firefly-mascot{animation:firefly-float 3.2s ease-in-out infinite}
    @keyframes firefly-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .firefly-blink{animation:firefly-blink 4s infinite;transform-origin:center}
    @keyframes firefly-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}}
    .firefly-wing{animation:firefly-wag 2.2s ease-in-out infinite;transform-origin:bottom center}
    @keyframes firefly-wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    .firefly-glow{animation:firefly-sparkle 1.6s ease-in-out infinite}
    @keyframes firefly-sparkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  </style>
</svg>
