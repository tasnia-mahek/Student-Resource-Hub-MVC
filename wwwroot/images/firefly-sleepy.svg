<svg viewBox="10 5 110 115" xmlns="http://www.w3.org/2000/svg" class="firefly-mascot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="firefly-gradient-sleepy" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d9ffe9"/>
      <stop offset="1" stop-color="#33e07a"/>
    </radialGradient>
  </defs>

  <g class="firefly-wing" style="animation-delay:-.3s">
    <ellipse cx="34" cy="58" rx="16" ry="9" fill="#eafff3" opacity=".35"/>
  </g>
  <g class="firefly-wing">
    <ellipse cx="96" cy="58" rx="16" ry="9" fill="#eafff3" opacity=".35"/>
  </g>

  <circle class="firefly-glow-dim" cx="65" cy="92" r="6" fill="#00FF66"/>

  <ellipse cx="65" cy="60" rx="24" ry="26" fill="url(#firefly-gradient-sleepy)"/>

  <!-- closed sleepy line-eyes, no blink animation needed -->
  <path d="M53 56q6 -5 12 0" stroke="#0a1f14" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M69 56q6 -5 12 0" stroke="#0a1f14" stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M60 68q3 2 6 0" stroke="#0a1f14" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="49" cy="64" r="4.6" fill="#ff9db8" opacity=".4"/>
  <circle cx="81" cy="64" r="4.6" fill="#ff9db8" opacity=".4"/>

  <path d="M56 36q-4 -8 -8 -10" stroke="#0a1f14" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M74 36q4 -8 8 -10" stroke="#0a1f14" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="48" cy="25" r="2.4" fill="#00FF66" opacity=".7"/>
  <circle cx="82" cy="25" r="2.4" fill="#00FF66" opacity=".7"/>

  <!-- little zzz to reinforce the sleepy/thinking state -->
  <text x="90" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#00FF66">z</text>
  <text x="98" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#00FF66" opacity=".7">z</text>

  <style>
    .firefly-mascot{animation:firefly-float 3.2s ease-in-out infinite}
    @keyframes firefly-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .firefly-wing{animation:firefly-wag-slow 3.4s ease-in-out infinite;transform-origin:bottom center}
    @keyframes firefly-wag-slow{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    .firefly-glow-dim{animation:firefly-sparkle-slow 2.4s ease-in-out infinite}
    @keyframes firefly-sparkle-slow{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.6;transform:scale(1)}}
  </style>
</svg>
